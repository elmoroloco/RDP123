name: Window 10 - Web Directo

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Download and Install TightVNC
      run: |
        Invoke-WebRequest -Uri "https://www.tightvnc.com/download/2.8.63/tightvnc-2.8.63-gpl-setup-64bit.msi" -OutFile vnc.msi
        Start-Process msiexec.exe -ArgumentList '/i vnc.msi /quiet ADDLOCAL="Server" VALUE_PASS=123456' -Wait

    - name: Start VNC Server
      run: |
        net start tvnserver

    - name: Download Cloudflare Tunnel (Cloudflared)
      run: |
        $url = "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
        Invoke-WebRequest -Uri $url -OutFile cloudflared.exe

    - name: Expose VNC Port via Cloudflare Web Tunnel
      run: .\cloudflared.exe tunnel --url localhost:5900
